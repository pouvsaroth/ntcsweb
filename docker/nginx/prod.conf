
# Central domains — see backend's TENANCY_CENTRAL_DOMAINS (config/tenancy.php)
# and keep this list in sync with it by hand. A school's own domain/subdomain
# is anything NOT in this map; those get redirected to the shared ERP login
# below instead of serving /admin, /login, etc. themselves.
map $host $is_central_domain {
    default 0;
    localhost 1;
    127.0.0.1 1;
    admin.ntcsweb.com 1;
    erp.newtechkh.com 1;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    root /var/www/frontend;
    index index.html;

    # A school's own domain/subdomain only ever serves its public website —
    # every login/admin path belongs to the one shared ERP domain now (see
    # the map above). Redirects rather than 404s so an old bookmark or a
    # search-engine-indexed link still lands somewhere useful, and runs here
    # (before the SPA or PHP ever loads) so it works even if the JS bundle
    # fails to load. $request_uri (not $uri) preserves the query string too.
    location ~ ^/(admin|login|forgot-password|reset-password)(/|$) {
        if ($is_central_domain = 0) {
            return 301 https://erp.newtechkh.com$request_uri;
        }

        try_files $uri $uri/ /index.html;
    }

    # Already-uploaded files (avatars, gallery photos, home slides) — pure
    # static serving via the public/storage symlink, no PHP involved.
    location /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
    }

    # Everything Laravel owns: the API, Sanctum's CSRF-cookie route, and the
    # /up health check — routed through the front controller exactly like
    # the dev nginx config does for the whole app, just scoped to these
    # three prefixes instead of everything.
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # The built Vue SPA (client-side routing) — everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
