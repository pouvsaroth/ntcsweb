# Two independently-built frontend bundles, one shared Laravel backend — see
# docs/multi-tenancy.md's "shared ERP login domain" section. A school's own
# domain/subdomain serves only its public website; the admin/ERP app lives
# on its own domain(s) instead of sharing an origin with any school's site.
# The PHP/API-proxy logic is identical for both, so it lives once in
# snippets/api-and-storage.conf rather than being duplicated per block.
server {
    listen 80;
    server_name erp.newtechkh.com admin.ntcsweb.com;
    client_max_body_size 50M;

    root /var/www/frontend/admin;
    index index.html;

    include /etc/nginx/snippets/api-and-storage.conf;

    # The built Vue SPA (client-side routing) — everything else.
    include /etc/nginx/snippets/spa-caching.conf;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    root /var/www/frontend/public;
    index index.html;

    # This bundle has no /admin build at all anymore — a school's own domain
    # hitting one of these paths gets sent to the shared ERP domain instead
    # of a 404, so an old bookmark or a search-engine-indexed link still
    # lands somewhere useful. Runs here (before the SPA or PHP ever loads)
    # so it works even if the JS bundle fails to load. $request_uri (not
    # $uri) preserves the query string too.
    location ~ ^/(admin|login|forgot-password|reset-password)(/|$) {
        return 301 https://erp.newtechkh.com$request_uri;
    }

    include /etc/nginx/snippets/api-and-storage.conf;

    # The built Vue SPA (client-side routing) — everything else.
    include /etc/nginx/snippets/spa-caching.conf;
}
