# Shared between both server blocks in prod.conf (the public website and the
# admin/ERP app) — the same one Laravel backend serves both, regardless of
# which frontend origin a request came from. Kept in one place so the two
# server blocks can never drift apart on how PHP/uploaded files are served.

# Already-uploaded files (avatars, gallery photos, home slides) — pure
# static serving via the public/storage symlink, no PHP involved.
location /storage/ {
    alias /var/www/html/public/storage/;
    try_files $uri =404;
}

# Everything Laravel owns: the API, Sanctum's CSRF-cookie route, and the
# /up health check — routed through the front controller exactly like
# the dev nginx config does for the whole app, just scoped to these
# three prefixes instead of everything.
location ~ ^/(api|sanctum|up)(/|$) {
    try_files $uri /index.php?$query_string;
}

location ~ \.php$ {
    root /var/www/html/public;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

location ~ /\.(?!well-known).* {
    deny all;
}
