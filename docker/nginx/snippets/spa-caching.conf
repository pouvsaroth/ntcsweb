# Shared between both server blocks in prod.conf. The built SPA's entry
# document must always be revalidated — a stale cached index.html can
# reference a content-hashed asset filename a later deploy has already
# deleted, so the entry script silently 404s and nothing ever renders (no
# console error, since the failing request never runs any of this app's own
# JS). Seen in practice via iOS's aggressive "Add to Home Screen" WebView
# cache, which holds onto old responses far more readily than a normal
# Safari tab does. Vite's content-hashed /assets/ files are the opposite —
# their filename changes whenever their content does, so caching them
# forever is safe and desirable.

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
