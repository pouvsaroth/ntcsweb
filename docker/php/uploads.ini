; Raised from PHP's stock 2M/8M defaults, which are too small for admin
; image uploads (school logos, gallery photos, homepage slider images).
; post_max_size stays a couple MB above upload_max_filesize to leave room
; for the surrounding multipart/form-data fields.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
