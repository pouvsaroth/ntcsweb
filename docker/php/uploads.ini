; Raised from PHP's stock 2M/8M defaults, which are too small for admin
; image uploads (school logos, gallery photos, homepage slider images) and
; the Upload menu's files (Photoshop files etc., up to 50M — see
; StoreDownloadFileRequest). Nginx's client_max_body_size is 55M, a little
; above, so a full 50M file plus its form fields still gets through.
; post_max_size stays a couple MB above upload_max_filesize to leave room
; for the surrounding multipart/form-data fields.
upload_max_filesize = 50M
post_max_size = 52M
memory_limit = 256M
