<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      The app has its own language switcher (vue-i18n). Browser page
      translation (e.g. Chrome's "Translate this page") swaps Vue's text
      nodes for its own <font> wrappers, so later locale changes update
      nodes that are no longer on screen and the page looks stuck in one
      language. Opt out so the in-app switcher always works.
    -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTCSWEB Admin</title>

    <!--
      Makes "Add to Home Screen" install this as a standalone app instead of
      a plain bookmark — without this, iOS/Android open a new browser tab
      every time the home-screen icon is tapped, so a student who reopens it
      a few times ends up with a pile of stacked tabs. With it, the OS
      launches (or refocuses) one standalone window, no browser chrome, no
      tab pileup. `scope` is the whole origin, not just /admin, since the
      unauthenticated redirect target (/login) lives outside /admin/* — see
      router/admin.ts's authRoutes — and must stay inside this same window.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5a800" />
    <link rel="apple-touch-icon" href="/icons/admin-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NTCSWEB" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter has no Khmer/CJK glyphs. Rather than switch fonts per locale, one
      stack lists Inter first and a Noto Sans variant per script after it —
      CSS font fallback happens per-glyph, so Latin text still renders in
      Inter and Khmer/Chinese/Korean/Japanese characters fall through to the
      matching Noto Sans automatically, all in a single font-family value
      (see --font-sans in src/assets/styles/main.css).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main-admin.ts"></script>
  </body>
</html>
