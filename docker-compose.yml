services:

  postgres:
    image: postgres:18
    container_name: ntscweb_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ntcsdb
      POSTGRES_USER: ntcsuser
      POSTGRES_PASSWORD: ntcspassword

    ports:
      - "5433:5432"

    # A real folder on the host, not a Docker-managed named volume — so the
    # local dev database (and everything in it: tenants, gallery/home-slide
    # rows, etc.) survives Docker Desktop resets/cleanups that only a
    # deliberate `-v` used to be safe from. See docker/postgres/data/.gitignore
    # for why the actual data files aren't committed.
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql

    networks:
      - ntscweb

  redis:
    image: redis:7-alpine
    container_name: ntscweb_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    networks:
      - ntscweb
      
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ntscweb_php
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
      # vendor/ lives on a native Docker volume, not the Windows bind mount:
      # Composer's ~10k+ small dependency files, read on every autoload,
      # are painfully slow through Docker Desktop's Windows file-sharing
      # bridge (multi-second wall-clock time per request despite near-zero
      # actual CPU time — the classic symptom). This shadows an empty
      # directory at first; run `composer install` once after bringing this
      # up to populate it.
      - backend_vendor:/var/www/html/vendor

    networks:
      - ntscweb

    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ntscweb_queue
    restart: unless-stopped

    working_dir: /var/www/html

    # Same image/codebase as the `php` service — this container just runs
    # `queue:work` instead of php-fpm. Without it, anything dispatched with
    # QUEUE_CONNECTION=redis (e.g. ProcessStudentImport) sits in Redis
    # forever with nothing consuming it.
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=600

    volumes:
      - ./backend:/var/www/html
      # Same vendor/ volume as the php service — same codebase, same
      # dependencies, no reason to duplicate the install.
      - backend_vendor:/var/www/html/vendor

    networks:
      - ntscweb

    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: ntscweb_nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - ntscweb

    depends_on:
      - php
      
networks:
  ntscweb:
    driver: bridge

volumes:
  redis_data:
  backend_vendor: