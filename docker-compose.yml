services:

  postgres:
    image: postgres:18
    container_name: ntscweb_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ntcsdb
      POSTGRES_USER: ntcsuser
      POSTGRES_PASSWORD: ntcspassword

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - ntscweb
      
  redis:
    image: redis:7-alpine
    container_name: ntscweb_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    networks:
      - ntscweb
      
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ntscweb_php
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    networks:
      - ntscweb

    depends_on:
      - postgres
      - redis
      
  nginx:
    image: nginx:alpine
    container_name: ntscweb_nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - ntscweb

    depends_on:
      - php
      
networks:
  ntscweb:
    driver: bridge

volumes:
  postgres_data:
  redis_data: