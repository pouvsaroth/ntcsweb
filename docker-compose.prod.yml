services:

  postgres:
    image: postgres:18
    container_name: ntcsweb_prod_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # No host port mapping — only reachable from other containers on the
    # `ntcsweb` network, never directly from the internet. Unlike the dev
    # compose file, which exposes 5433 for a local DB client to connect to.
    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - ntcsweb

  redis:
    image: redis:7-alpine
    container_name: ntcsweb_prod_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - ntcsweb

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ntcsweb_prod_php
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

    networks:
      - ntcsweb

    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ntcsweb_prod_queue
    restart: unless-stopped

    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=600

    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

    networks:
      - ntcsweb

    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: ntcsweb_prod_nginx
    restart: unless-stopped

    # Bound to localhost only — the host's own Apache is the actual public
    # front door (TLS termination + the newtechkh.com/www vhost) and reverse
    # proxies here. Nothing on the internet can reach this port directly.
    ports:
      - "127.0.0.1:8095:80"

    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - ntcsweb

    depends_on:
      - php

networks:
  ntcsweb:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
