name: Deploy Website

# The public website's own, independent deploy — no backend tests, no
# backend SSH commands, just a static build uploaded straight to its own
# doc-root (see docker/nginx/prod.conf). Only triggers on paths that could
# actually affect the public bundle, so an admin-only or backend-only change
# never runs this at all. See .github/workflows/deploy.yml for the
# admin/ERP app + backend's own (heavier, always-runs) pipeline, and
# docs/multi-tenancy.md's ERP domain section for why the two are split.
on:
  push:
    branches: [main]
    paths:
      - "frontend/src/pages/public/**"
      - "frontend/src/components/public/**"
      - "frontend/src/components/layout/PublicHeader.vue"
      - "frontend/src/components/layout/PublicFooter.vue"
      - "frontend/src/layouts/PublicLayout.vue"
      - "frontend/src/router/index.ts"
      - "frontend/src/router/publicNav.ts"
      - "frontend/index.html"
      - "frontend/vite.config.ts"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

concurrency:
  group: production-deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-website:
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build:public

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Scoped to frontend/dist/public/ specifically — never touches
      # dist/admin/, which deploy.yml's own independent run manages. No
      # backend commands at all: this bundle is static files nginx already
      # knows how to serve from that doc-root.
      # Open tabs still run the previous build and ask for its hashed files
      # (/assets/*.js) when someone opens another page. So: new hashed files
      # first, deleting nothing; then index.html, version.json and the rest
      # (assets/ left alone); old hashed files are only removed once they are
      # 14 days old. rsync -a stamps every file still in the build with the
      # new build time, so only files no build uses any more ever age out.
      - name: Upload public frontend build
        run: |
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          DEST="${{ secrets.DEPLOY_PATH }}/frontend/dist/public"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" dist/public/assets/ "$REMOTE:$DEST/assets/"
          rsync -az --delete --exclude "/assets/" -e "ssh -i ~/.ssh/deploy_key" dist/public/ "$REMOTE:$DEST/"
          ssh -i ~/.ssh/deploy_key "$REMOTE" "find \"$DEST/assets\" -type f -mtime +14 -delete"
